# Entorno de PRODUCCIÓN (referencia).
# Uso:  docker compose -f compose.prod.yaml up -d --build
#
# Aquí NO se montan volúmenes de código: todo va dentro de la imagen.
# Las variables sensibles deben venir del entorno del servidor, no de un .env
# versionado.

name: el-tapaso-prod

services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql   # PostgreSQL 18+ espera el mount aquí, no en .../data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tapaso_net

  backend:
    build:
      context: ./apps/backend-django
      target: production
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tapaso_net

  frontend:
    build:
      context: ./apps/frontend-react
      target: production
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tapaso_net

volumes:
  postgres_data:

networks:
  tapaso_net:
    driver: bridge
